apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphql-gateway
  template:
    metadata:
      labels:
        app: graphql-gateway
    spec:
      containers:
      - name: graphql-gateway
        image: <your-dockerhub-username>/graphql-gateway:latest
        ports:
        - containerPort: 4000
        env:
        - name: FASTAPI_URL
          value: "http://recommendation-api-service"  # Use the internal DNS name for your FastAPI service
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway-service
spec:
  selector:
    app: graphql-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4000
  type: LoadBalancer
